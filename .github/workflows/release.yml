name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.5.1
      - name: Install pinned build dependencies
        run: opam install ./ocaml --deps-only --with-test --with-dev-setup --yes
      - name: Build Rust host and OCaml proof worker
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          opam exec -- dune build --root ocaml --profile release @all
          cargo build --release --locked --bin rationale --target "${{ matrix.target }}"
      - name: Require the release tag to match the binary
        if: github.ref_type == 'tag'
        run: |
          version=$("target/${{ matrix.target }}/release/rationale" --version)
          test "$GITHUB_REF_NAME" = "v${version#rationale }"
      - name: Package companion executables and offline demo
        env:
          RATIONALE_BINARY: target/${{ matrix.target }}/release/rationale
          RATIONALE_WORKER_BINARY: ocaml/_build/default/worker/main.exe
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          scripts/package-release.sh "${{ matrix.target }}"
      - name: Smoke-test the extracted CLI, demo, and MCP server
        run: |
          set -- dist/rationale-v*-${{ matrix.target }}.tar.gz
          test "$#" -eq 1
          test -f "$1"
          scripts/smoke-release.sh "$1"
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rationale-${{ matrix.target }}
          path: |
            dist/rationale-v*-${{ matrix.target }}.tar.gz
            dist/rationale-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public license metadata
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q '^license = "Apache-2.0"$' Cargo.toml
          grep -q '^license: "Apache-2.0"$' ocaml/rationale-kernel.opam
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rationale-*
          path: dist
          merge-multiple: true
      - name: Verify and combine archive checksums
        run: |
          : > dist/SHA256SUMS
          for checksum in dist/*.tar.gz.sha256; do
            archive=${checksum%.sha256}
            expected=$(awk '{print $1}' "$checksum")
            actual=$(sha256sum "$archive" | awk '{print $1}')
            test "$expected" = "$actual"
            printf '%s  %s\n' "$actual" "$(basename "$archive")" >> dist/SHA256SUMS
          done
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Rationale $GITHUB_REF_NAME"
