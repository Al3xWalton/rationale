[package]
name = "rationale-bench"
description = "Reproducible performance harness for Rationale"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "rationale-bench"
path = "src/main.rs"

[dependencies]
clap.workspace = true
jiff.workspace = true
rationale-engine = { path = "../rationale-engine", version = "=0.1.0" }
rationale-model = { path = "../rationale-model", version = "=0.1.0" }
rationale-protocol = { path = "../rationale-protocol", version = "=0.1.0" }
rationale-store = { path = "../rationale-store", version = "=0.1.0" }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
