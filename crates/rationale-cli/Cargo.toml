[package]
name = "rationale-cli"
description = "Command-line interface for Rationale"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "rationale"
path = "src/main.rs"

[dependencies]
clap.workspace = true
rationale-engine = { path = "../rationale-engine", version = "=0.1.0" }
rationale-github = { path = "../rationale-github", version = "=0.1.0" }
rationale-mcp = { path = "../rationale-mcp", version = "=0.1.0" }
rationale-model = { path = "../rationale-model", version = "=0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[lints]
workspace = true
