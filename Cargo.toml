[workspace]
members = ["crates/rationale-cli", "crates/rationale-docs", "crates/rationale-engine", "crates/rationale-git", "crates/rationale-model", "crates/rationale-protocol", "crates/rationale-store"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Al3xWalton/rationale"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
blake3 = "=1.8.7"
clap = { version = "=4.6.6", features = ["derive"] }
git2 = "=0.21.0"
jiff = "=0.2.35"
jsonschema = { version = "=0.56.0", default-features = false }
pulldown-cmark = "=0.13.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=1.2.0"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "=1.1.5"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
