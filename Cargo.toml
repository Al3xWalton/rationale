[workspace]
members = ["crates/rationale-model", "crates/rationale-protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Al3xWalton/rationale"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
jsonschema = { version = "=0.56.0", default-features = false }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
