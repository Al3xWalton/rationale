[workspace]
members = ["crates/rationale-model"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Al3xWalton/rationale"
rust-version = "1.98"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
